<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Control - Análisis de Aceite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-6 font-sans text-gray-800">

    <div class="max-w-screen-2xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow-xl border-t-4 border-blue-600">
        
        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 uppercase tracking-wide">Análisis de Aceite 2020-2026</h1>
                <h2 class="text-lg text-gray-500 font-semibold mt-1">Tablero de Control - Minería</h2>
            </div>
            <div id="estadoCarga" class="text-sm font-bold text-blue-600 bg-blue-50 p-2 rounded">
                Cargando bases de datos...
            </div>
        </div>

        <!-- Barra de Filtros -->
        <div id="filtrosContainer" class="hidden flex-wrap gap-6 mb-8 bg-gray-50 p-5 rounded-md border border-gray-200 shadow-sm">
            <div class="flex flex-col w-48">
                <label for="flotaFilter" class="text-xs font-bold text-gray-600 uppercase mb-1">Flota</label>
                <select id="flotaFilter" class="border border-gray-300 rounded p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Todas">Todas</option>
                </select>
            </div>

            <div class="flex flex-col w-48">
                <label for="equipoFilter" class="text-xs font-bold text-gray-600 uppercase mb-1">Equipo</label>
                <select id="equipoFilter" class="border border-gray-300 rounded p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Todos">Todos</option>
                </select>
            </div>

            <div class="flex flex-col w-48">
                <label for="timeDimension" class="text-xs font-bold text-gray-600 uppercase mb-1">Eje X (Fecha Calculada)</label>
                <select id="timeDimension" class="border border-gray-300 rounded p-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="year">Año</option>
                    <option value="month">Mes</option>
                    <option value="year-month" selected>Año - Mes</option>
                </select>
            </div>
        </div>

        <!-- Contenedor de los 4 Gráficos (Grid 2x2) -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Gráfico 1: Desgaste -->
            <div class="border rounded-lg p-4 bg-white shadow-sm">
                <h3 class="text-md font-bold text-gray-700 mb-2 text-center">Revisión de Desgaste Promedio ppm (Metales)</h3>
                <div class="relative w-full h-72"><canvas id="desgasteChart"></canvas></div>
            </div>

            <!-- Gráfico 2: Códigos ISO -->
            <div class="border rounded-lg p-4 bg-white shadow-sm">
                <h3 class="text-md font-bold text-gray-700 mb-2 text-center">Códigos ISO</h3>
                <div class="relative w-full h-72"><canvas id="isoChart"></canvas></div>
            </div>

            <!-- Gráfico 3: Consumo de Aceite -->
            <div class="border rounded-lg p-4 bg-white shadow-sm">
                <h3 class="text-md font-bold text-gray-700 mb-2 text-center">Consumo de Aceite</h3>
                <div class="relative w-full h-72"><canvas id="consumoChart"></canvas></div>
            </div>

            <!-- Gráfico 4: Cilindros y Bombas -->
            <div class="border rounded-lg p-4 bg-white shadow-sm">
                <h3 class="text-md font-bold text-gray-700 mb-2 text-center">Cambio de Cilindros y Bombas Hidráulicas</h3>
                <div class="relative w-full h-72"><canvas id="cilindrosChart"></canvas></div>
            </div>

        </div>
    </div>

    <script>
        // Variables globales para almacenar los datos de los 3 archivos
        let dataTrakka = [];
        let dataComponentes = [];
        let dataConsumo = [];
        
        // Variables para las instancias de Chart.js
        let charts = { desgaste: null, iso: null, consumo: null, cilindros: null };

        // Función auxiliar para leer CSV como Promesa
        function fetchCSV(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: results => resolve(results.data),
                    error: err => reject(err)
                });
            });
        }

        // 1. Cargar todos los archivos al iniciar
        window.onload = function() {
            Promise.all([
                fetchCSV('Data_aceites_ANALISIS_DE_ACEITE_TRAKKA.csv'),
                fetchCSV('Data_aceites_BD_COMPONENTES_REMOVIDOS.csv'),
                fetchCSV('Data_aceites_CONSUMO_DE_ACEITE.csv')
            ]).then(([trakka, componentes, consumo]) => {
                dataTrakka = trakka;
                dataComponentes = componentes;
                dataConsumo = consumo;
                
                document.getElementById('estadoCarga').textContent = "Datos cargados correctamente ✓";
                document.getElementById('estadoCarga').className = "text-sm font-bold text-green-600 bg-green-50 p-2 rounded";
                document.getElementById('filtrosContainer').classList.remove('hidden');
                document.getElementById('filtrosContainer').classList.add('flex');
                
                inicializarFiltros();
                procesarYDibujarTodo();
            }).catch(err => {
                document.getElementById('estadoCarga').textContent = "Error al cargar CSVs. Verifica que estén en GitHub.";
                document.getElementById('estadoCarga').className = "text-sm font-bold text-red-600 bg-red-50 p-2 rounded";
            });
        };

        // Extraer filtros (Flotas y Equipos basados principalmente en Trakka)
        function inicializarFiltros() {
            const flotas = new Set();
            const equipos = new Set();
            dataTrakka.forEach(row => {
                if (row['Flota']) flotas.add(row['Flota'].trim());
                if (row['Equipo']) equipos.add(row['Equipo'].trim());
            });

            const flotaSelect = document.getElementById('flotaFilter');
            const equipoSelect = document.getElementById('equipoFilter');
            
            Array.from(flotas).sort().forEach(f => flotaSelect.appendChild(new Option(f, f)));
            Array.from(equipos).sort().forEach(e => equipoSelect.appendChild(new Option(e, e)));
        }

        // Utilidad: Parsear números con coma
        const num = str => parseFloat((str||'').toString().replace(',', '.')) || 0;

        // Utilidad: Estandarizar fechas (maneja formato texto o número serial de Excel)
        function parseFecha(fechaStr) {
            if (!fechaStr) return null;
            let f = fechaStr.toString().trim();
            if (!isNaN(f)) { 
                // Es un número de serie de Excel (Ej. 46261)
                const date = new Date((parseInt(f) - 25569) * 86400 * 1000);
                return { año: date.getUTCFullYear().toString(), mes: (date.getUTCMonth() + 1).toString().padStart(2, '0') };
            }
            const partes = f.split(/[-/ T]/);
            if (partes.length >= 3) {
                if (partes[0].length === 4) return { año: partes[0], mes: partes[1].padStart(2, '0') };
                else return { año: partes[2].substring(0,4), mes: partes[1].padStart(2, '0') }; // DD/MM/YYYY
            }
            return null;
        }

        // Obtener la clave del Eje X
        function getXKey(fechaStr, dimension) {
            const parsed = parseFecha(fechaStr);
            if (!parsed) return null;
            if (dimension === 'year') return parsed.año;
            if (dimension === 'month') return `Mes ${parsed.mes}`;
            return `${parsed.año}-${parsed.mes}`;
        }

        // Función principal que actualiza los 4 gráficos
        function procesarYDibujarTodo() {
            const flotaSel = document.getElementById('flotaFilter').value;
            const equipoSel = document.getElementById('equipoFilter').value;
            const dimTiempo = document.getElementById('timeDimension').value;

            // --- PROCESAR TRAKKA (Desgaste e ISO) ---
            const statsTrakka = {};
            dataTrakka.forEach(d => {
                if (flotaSel !== 'Todas' && d['Flota'] !== flotaSel) return;
                if (equipoSel !== 'Todos' && d['Equipo'] !== equipoSel) return;
                
                const xKey = getXKey(d['Fecha Calculada'], dimTiempo);
                if (!xKey) return;

                if (!statsTrakka[xKey]) statsTrakka[xKey] = { h:0, c:0, p:0, cr:0, a:0, iso4:0, iso6:0, iso14:0, count:0 };
                statsTrakka[xKey].h += num(d['Hierro (ppm)']);
                statsTrakka[xKey].c += num(d['Cobre (ppm)']);
                statsTrakka[xKey].p += num(d['Plomo (ppm)']);
                statsTrakka[xKey].cr += num(d['Cromo (ppm)']);
                statsTrakka[xKey].a += num(d['Aluminio (ppm)']);
                statsTrakka[xKey].iso4 += num(d['ISO 4406:1999 > 04µ']);
                statsTrakka[xKey].iso6 += num(d['ISO 4406:1999 > 06µ']);
                statsTrakka[xKey].iso14 += num(d['ISO 4406:1999 > 14µ']);
                statsTrakka[xKey].count++;
            });

            // --- PROCESAR COMPONENTES (Cilindros y Bombas) ---
            const statsComponentes = {};
            dataComponentes.forEach(d => {
                if (flotaSel !== 'Todas' && d['Flota'] !== flotaSel && d['Equipo/EGI'] !== flotaSel) return;
                if (equipoSel !== 'Todos' && d['Equipo'] !== equipoSel) return;

                const tipo = (d['Tipo De Componente'] || '').toUpperCase();
                if (!tipo.includes('CILINDRO') && !tipo.includes('BOMBA')) return; // Solo Cilindros y Bombas

                const xKey = getXKey(d['Fecha Calculada'] || d['Fecha'], dimTiempo);
                if (!xKey) return;

                if (!statsComponentes[xKey]) statsComponentes[xKey] = 0;
                statsComponentes[xKey]++; // Contar reemplazos
            });

            // --- PROCESAR CONSUMO ---
            const statsConsumo = {};
            dataConsumo.forEach(d => {
                if (flotaSel !== 'Todas' && d['Flota'] !== flotaSel) return;
                if (equipoSel !== 'Todos' && d['Equipo'] !== equipoSel) return;

                const xKey = getXKey(d['Fecha Calculada'] || d['Fecha'], dimTiempo);
                if (!xKey) return;

                if (!statsConsumo[xKey]) statsConsumo[xKey] = 0;
                statsConsumo[xKey] += num(d['Despachado'] || d['Valor']); // Asumiendo columna de cantidad
            });

            // --- UNIFICAR ETIQUETAS (Eje X) ---
            const todasLasEtiquetas = new Set([...Object.keys(statsTrakka), ...Object.keys(statsComponentes), ...Object.keys(statsConsumo)]);
            const labels = Array.from(todasLasEtiquetas).sort();

            // Preparar arrays para Chart.js
            const dHierro = [], dCobre = [], dPlomo = [], dCromo = [], dAlum = [];
            const dIso4 = [], dIso6 = [], dIso14 = [];
            const dCilindros = [], dConsumo = [];

            labels.forEach(l => {
                const tk = statsTrakka[l];
                if (tk) {
                    dHierro.push(tk.h / tk.count); dCobre.push(tk.c / tk.count); dPlomo.push(tk.p / tk.count);
                    dCromo.push(tk.cr / tk.count); dAlum.push(tk.a / tk.count);
                    dIso4.push(tk.iso4 / tk.count); dIso6.push(tk.iso6 / tk.count); dIso14.push(tk.iso14 / tk.count);
                } else {
                    dHierro.push(0); dCobre.push(0); dPlomo.push(0); dCromo.push(0); dAlum.push(0);
                    dIso4.push(0); dIso6.push(0); dIso14.push(0);
                }
                dCilindros.push(statsComponentes[l] || 0);
                dConsumo.push(statsConsumo[l] || 0);
            });

            dibujarGraficos(labels, {dHierro, dCobre, dPlomo, dCromo, dAlum}, {dIso4, dIso6, dIso14}, dCilindros, dConsumo);
        }

        // Crear/Actualizar instancias de Chart.js
        function dibujarGraficos(labels, tk, iso, cilindros, consumo) {
            const chartOpts = { responsive: true, maintainAspectRatio: false };
            
            // 1. Desgaste
            if (charts.desgaste) charts.desgaste.destroy();
            charts.desgaste = new Chart(document.getElementById('desgasteChart'), {
                type: 'line',
                data: { labels: labels, datasets: [
                    { label: 'Hierro', data: tk.dHierro, borderColor: '#1f2937', tension: 0.2 },
                    { label: 'Cobre', data: tk.dCobre, borderColor: '#9ca3af', tension: 0.2 },
                    { label: 'Plomo', data: tk.dPlomo, borderColor: '#fbbf24', tension: 0.2 }
                ]}, options: chartOpts
            });

            // 2. ISO
            if (charts.iso) charts.iso.destroy();
            charts.iso = new Chart(document.getElementById('isoChart'), {
                type: 'line',
                data: { labels: labels, datasets: [
                    { label: 'ISO > 04µ', data: iso.dIso4, borderColor: '#3b82f6', tension: 0.2 },
                    { label: 'ISO > 06µ', data: iso.dIso6, borderColor: '#10b981', tension: 0.2 },
                    { label: 'ISO > 14µ', data: iso.dIso14, borderColor: '#ef4444', tension: 0.2 }
                ]}, options: chartOpts
            });

            // 3. Consumo
            if (charts.consumo) charts.consumo.destroy();
            charts.consumo = new Chart(document.getElementById('consumoChart'), {
                type: 'bar',
                data: { labels: labels, datasets: [
                    { label: 'Consumo (Galones/Despacho)', data: consumo, backgroundColor: '#6366f1' }
                ]}, options: chartOpts
            });

            // 4. Cilindros y Bombas
            if (charts.cilindros) charts.cilindros.destroy();
            charts.cilindros = new Chart(document.getElementById('cilindrosChart'), {
                type: 'bar',
                data: { labels: labels, datasets: [
                    { label: 'Cant. Componentes Removidos', data: cilindros, backgroundColor: '#f97316' }
                ]}, options: chartOpts
            });
        }

        // Eventos de Filtros
        document.getElementById('flotaFilter').addEventListener('change', procesarYDibujarTodo);
        document.getElementById('equipoFilter').addEventListener('change', procesarYDibujarTodo);
        document.getElementById('timeDimension').addEventListener('change', procesarYDibujarTodo);
    </script>
</body>
</html>
